<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Demédico · Next (test Supabase)</title>
<style>
  :root{--bg:#F4F7F7;--surface:#FFFFFF;--surface-2:#F8FAFA;--text:#142226;--text-2:#526268;--text-3:#849095;--line:#E4EAEA;--brand:#248780;--ink:#133239;--success:#2F7A58;--warning:#A96D2D;--danger:#B24F56;--soft:#E7F4F2}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
  button,input,select,textarea{font:inherit}
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;min-height:40px;padding:0 16px;font-weight:700;cursor:pointer}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.55;cursor:default}
  .field{display:grid;gap:6px}
  .field label{font-size:11px;font-weight:800;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em}
  .field input,.field select{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;min-width:0;width:100%}
  .field input:focus,.field select:focus{outline:none;border-color:#8ABAB7;box-shadow:0 0 0 3px rgba(36,135,128,.12)}
  /* Connexion */
  .auth{min-height:100vh;display:flex;padding:24px 16px}
  .auth-card{margin:auto;width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px 26px;box-shadow:0 24px 80px rgba(18,34,38,.10);display:grid;gap:14px}
  .auth-card img{width:170px;display:block;margin:0 auto 6px}
  .auth-card h1{margin:4px 0 0;font-size:26px;letter-spacing:-.04em}
  .auth-card p{margin:0;color:var(--text-2);font-size:13px}
  .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--brand);background:var(--soft);padding:4px 8px;border-radius:8px}
  .link{border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer;padding:0;font-size:12.5px}
  /* Appli */
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 20px;padding-top:max(12px,env(safe-area-inset-top));background:rgba(244,247,247,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .top img{height:30px}
  .top .who{margin-left:auto;text-align:right;font-size:12px;color:var(--text-2)}
  .top .who strong{display:block;color:var(--text);font-size:13px}
  .tabs{display:flex;gap:4px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:14px;margin:16px 20px 0;overflow-x:auto}
  .tabs button{border:0;background:none;padding:9px 14px;border-radius:10px;font-weight:750;color:var(--text-2);cursor:pointer;white-space:nowrap}
  .tabs button.active{background:var(--text);color:#fff}
  main{padding:16px 20px 40px;max-width:1180px;margin:0 auto}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}
  .card h2{margin:0;font-size:17px;letter-spacing:-.02em}
  .sub{color:var(--text-3);font-size:12px;margin-top:3px}
  .grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:16px;align-items:start}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .list{margin-top:14px;display:grid;gap:8px}
  .item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
  .avatar{width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-weight:850;flex:0 0 38px}
  .item .grow{flex:1;min-width:0}
  .item strong{display:block;font-size:13.5px}
  .item small{color:var(--text-2);font-size:12px;overflow-wrap:anywhere}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .form .full{grid-column:1/-1}
  .ph{display:grid;grid-template-columns:minmax(110px,42%) 1fr;gap:8px}
  .empty{padding:22px;text-align:center;color:var(--text-3);font-size:12.5px}
  .day{margin-top:14px}
  .day h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3)}
  .chip{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--brand);white-space:nowrap}
  .chip.ok{background:#E7F4EC;color:var(--success)} .chip.ko{background:#F8E9EA;color:var(--danger)}
  .metric{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
  .metric:last-child{border-bottom:0}
  .metric b{font-variant-numeric:tabular-nums}
  .banner{padding:12px 14px;border-radius:14px;background:#FFF7E8;border:1px solid #F1DFC0;color:#6D4B22;font-size:12.5px;margin:16px 20px 0}
  .toasts{position:fixed;right:16px;bottom:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:50;display:grid;gap:8px;width:min(380px,calc(100vw - 32px))}
  .toast{padding:12px 14px;border-radius:12px;background:var(--text);color:#fff;font-size:12.5px;box-shadow:0 16px 40px rgba(18,34,38,.22)}
  .toast.error{background:#8F3D45}
  [hidden]{display:none !important}
  @media (max-width:900px){.grid2{grid-template-columns:1fr}}
  @media (max-width:560px){.form{grid-template-columns:1fr}.ph{grid-template-columns:1fr}.top{padding:10px 14px}.tabs,.banner{margin-left:14px;margin-right:14px}main{padding:14px}.top .who{margin-left:0;text-align:left;width:100%}}
</style>
</head>

  // Chronomètre : chaque appel à la base est mesuré et affiché dans Diagnostic.
  async function timed(label, fn) {

  // Téléphones : même règle que Demédico (indicatifs libphonenumber).
  const PH_NAMES = (() => { try { return new Intl.DisplayNames(['fr'], {type:'region'}); } catch (e) { return null; } })();
  const flag = iso => iso.replace(/./g, ch => String.fromCodePoint(127397 + ch.charCodeAt(0)));
  function countryOptions(sel) {
    const list = Object.keys(DIAL).map(i => ({i, n:(PH_NAMES && PH_NAMES.of(i)) || i})).sort((a, b) => a.n.localeCompare(b.n, 'fr'));
    const top = ['FR', 'IL', 'BE', 'CH', 'CA', 'MA'];
    const o = i => '<option value="' + i + '"' + (i === sel ? ' selected' : '') + '>' + flag(i) + ' ' + esc((PH_NAMES && PH_NAMES.of(i)) || i) + ' (+' + DIAL[i] + ')</option>';
    return '<optgroup label="Fréquents">' + top.map(o).join('') + '</optgroup><optgroup label="Tous les pays">' + list.map(x => o(x.i)).join('') + '</optgroup>';
  }
  function phFormat(v) {
    v = String(v || ''); if (!v.startsWith('+')) return v;
    const d = v.slice(1), codes = [...new Set(Object.values(DIAL))].sort((a, b) => b.length - a.length), c = codes.find(x => d.startsWith(x));
    if (!c) return v; const n = d.slice(c.length);
    return '+' + c + ' ' + (c === '33' ? n.replace(/^(\d)(\d{2})(\d{2})(\d{2})(\d{2})$/, '$1 $2 $3 $4 $5') : n.replace(/^(\d{2})(\d{3})(\d+)$/, '$1 $2 $3'));
  }
  function e164(raw, iso) {
    let d = String(raw || '').trim().replace(/[^\d+]/g, '');
    if (!d) return null;
    if (d.indexOf('+') > 0) d = d.replace(/\+/g, '');
    if (d.startsWith('+')) d = '+' + d.slice(1);
    else if (d.startsWith('00')) d = '+' + d.slice(2);
    else { if (d.startsWith('0') && ['IT', 'SM', 'VA'].indexOf(iso) < 0) d = d.slice(1); d = '+' + DIAL[iso] + d; }
    if (d.length - 1 < 7 || d.length - 1 > 15) throw new Error('Numéro de téléphone invalide.');
    return d;
  }

  const STATUS = {BOOKED:'Prévu', DONE:'Terminé', CANCELLED:'Annulé', NO_SHOW:'Absent'};

  // ── Diagnostic : vitesse et sécurité ───────────────────────────────────────
  function renderDiag(results) {

      '</div><div class="row" style="margin-top:12px"><button class="btn primary" id="secRun">Lancer les tests</button></div></section></div>';
    $('bench').onclick = async () => { for (let i = 0; i < 5; i++) { await loadPatients(); await loadAgenda(); } renderDiag(results); toast('Mesures terminées.'); };
    $('secRun').onclick = runSecurity;
  }
  async function runSecurity() {
    const res = [];
    // 1. Un visiteur sans compte ne lit aucun patient.
    const anon = window.supabase.createClient(CFG.url, CFG.publishableKey, {auth:{persistSession:false, autoRefreshToken:false, storageKey:'dm-anon-test'}});
    const a = await anon.from('patients').select('id');
    res.push({label:'Sans compte : aucun patient visible', ok:!a.error ? a.data.length === 0 : true});
    // 2. Je ne vois que les patients de mon cabinet.
    const mine = await sb.from('patients').select('organization_id');
    res.push({label:'Je ne vois que mon cabinet', ok:!mine.error && mine.data.every(p => p.organization_id === S.org.id)});
    // 3. Écrire dans un autre cabinet est refusé.
    const other = '00000000-0000-0000-0000-00000000000b';
    const w = await sb.from('patients').insert({organization_id:other, first_name:'Intrus', last_name:'Test'}).select('id');
    res.push({label:'Créer un patient dans un autre cabinet : refusé', ok:!!w.error});
    // 4. Je ne peux pas me donner un autre rôle.
    const r = await sb.from('organization_members').update({role:'OWNER'}).eq('user_id', S.user.id).select('role');
    res.push({label:'Me promouvoir propriétaire : refusé', ok:!!r.error || !r.data || r.data.length === 0});
    // 5. Je ne lis aucun abonnement ni compte Super Admin.
    const pa = await sb.from('platform_admins').select('user_id');
    res.push({label:'Liste des Super Admins : invisible', ok:!!pa.error || pa.data.length === 0});
    renderDiag(res);
    toast(res.every(x => x.ok) ? 'Tous les tests de sécurité sont au vert.' : 'Au moins un test a échoué : envoie une capture.', res.every(x => x.ok) ? '' : 'error');
  }

  boot().catch(err => showLogin(frErr(err)));
})();
</script>
</body>
</html>
